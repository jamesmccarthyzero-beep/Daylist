<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life HQ Card Hover Demo</title>
  <link rel="stylesheet" href="visual.css" />
</head>
<body>

  <main class="demo-page">
    <h1>Life HQ</h1>
    <p class="subtitle">Feature card hover demo</p>

    <section class="card-grid">
      <article class="feature-card">
        <div class="card-badge">MONEY HQ</div>

        <h2>Cash Flow & Smart Alerts</h2>
        <p>
          Track bills, due dates, balances, market watchlists,
          and important reminders from one command center.
        </p>

        <div class="stats">
          <div class="stat-box">
            <span class="stat-label">Bills due</span>
            <strong>3 this week</strong>
          </div>

          <div class="stat-box">
            <span class="stat-label">Portfolio</span>
            <strong>+2.4%</strong>
          </div>

          <div class="stat-box">
            <span class="stat-label">Alerts</span>
            <strong>5 active</strong>
          </div>
        </div>

        <div class="card-actions">
          <button class="primary-btn">Open module</button>
          <button class="secondary-btn">View alerts</button>
        </div>
      </article>
    </section>

    

    
  </main>

</body>
</html>
